<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新聞追蹤 RSS 閱讀器</title>
  <style>
    :root {
      --bg-page: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --accent-text: #1e40af;
      --tag-bg: #e2e8f0;
      --tag-text: #334155;
      --read-opacity: 0.55;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    }
    body.dark {
      --bg-page: #0b0f19;
      --bg-surface: #151d2e;
      --bg-subtle: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #1e3a8a;
      --accent-text: #bfdbfe;
      --tag-bg: #334155;
      --tag-text: #e2e8f0;
      --read-opacity: 0.5;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Sticky Top Header */
    header.reader-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }
    .header-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .issue-badge {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--accent-light);
      color: var(--accent-text);
      font-weight: 600;
      white-space: nowrap;
    }
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .header-tools {
      max-width: 900px;
      margin: 0 auto;
      padding: 6px 16px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .search-box {
      flex: 1 1 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 5px 10px 5px 28px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 0.85rem;
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg-surface);
    }
    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.8rem;
      pointer-events: none;
    }
    .tool-toggles {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }
    .filter-pills {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      font-size: 0.76rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .pill:hover, .pill.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }
    /* Archive Drawer */
    #archiveDrawer {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 16px;
      background: var(--bg-surface);
      border-bottom: 2px solid var(--accent);
    }
    #archiveDrawer.open {
      display: block;
    }
    .archive-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .archive-card {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-subtle);
      cursor: pointer;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .archive-card:hover, .archive-card.current {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .archive-card .date {
      font-weight: 600;
      font-size: 0.88rem;
    }
    .archive-card .count {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    /* Reader Content Area */
    main#readerViewport {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }
    .loading-spinner {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 1rem;
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
    }
    body.dark .error-box {
      background: #450a0a;
      border-color: #7f1d1d;
      color: #fecaca;
    }
    /* Read State */
    .article-item.is-read {
      opacity: var(--read-opacity);
    }
    .article-item.is-read:hover {
      opacity: 0.95;
    }
    .article-item.search-hidden, .source-section.search-hidden {
      display: none !important;
    }
    .article-item.unread-hidden {
      display: none !important;
    }
    .source-section.empty-hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header class="reader-header">
    <div class="header-main">
      <div class="brand-section">
        <span class="brand-title">📰 新聞追蹤</span>
        <span id="issueStatusBadge" class="issue-badge">載入中...</span>
      </div>
      <div class="nav-controls">
        <button id="btnPrev" class="btn" title="上一篇 (← 或 J)">⟨ 上一篇</button>
        <button id="btnNext" class="btn" title="下一篇 (→ 或 K)">下一篇 ⟩</button>
        <button id="btnLatest" class="btn" title="最新報告 (Home)">⚡ 最新</button>
        <button id="btnArchive" class="btn" title="查看所有歷史歸檔 (A)">📚 歷史歸檔</button>
        <button id="btnTheme" class="btn" title="切換深淺主題">🌓</button>
        <a id="btnRawPage" class="btn" href="reports/latest.zh-TW.html" target="_blank" title="在新分頁開啟原始 HTML">↗ 原始頁</a>
      </div>
    </div>
    <div class="header-tools">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="搜尋標題、摘要、關鍵字... (按 / 聚焦)" />
      </div>
      <div class="tool-toggles">
        <label><input type="checkbox" id="toggleOnlyUnread"> 只看未讀</label>
        <label><input type="checkbox" id="toggleHideEmpty" checked> 隱藏無命中來源</label>
        <button id="btnMarkAllRead" class="btn" style="padding:2px 8px;font-size:0.78rem;">全部標為已讀</button>
      </div>
    </div>
    <div id="filterPills" class="filter-pills"></div>
  </header>

  <div id="archiveDrawer">
    <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:8px;">歷史發布存檔列表（點選即刻瀏覽）：</div>
    <div id="archiveListContainer" class="archive-list"></div>
  </div>

  <main id="readerViewport">
    <div class="loading-spinner">正在載入新聞報告...</div>
  </main>

  <script>
    (function() {
      const STORAGE_READ_KEY = "nt_reader_read_urls_v1";
      const STORAGE_THEME_KEY = "nt_reader_theme";
      
      let manifest = null;
      let currentIndex = -1; // -1 represents latest, >=0 represents index in manifest.archives
      let issuesList = []; // [latest, ...archives]
      let currentActiveSource = "ALL";

      // Read tracker
      function getReadSet() {
        try {
          return new Set(JSON.parse(localStorage.getItem(STORAGE_READ_KEY) || "[]"));
        } catch(e) {
          return new Set();
        }
      }
      function markUrlRead(url) {
        if (!url) return;
        const set = getReadSet();
        set.add(url);
        try {
          localStorage.setItem(STORAGE_READ_KEY, JSON.stringify(Array.from(set)));
        } catch(e) {}
      }

      // Theme toggle
      const savedTheme = localStorage.getItem(STORAGE_THEME_KEY);
      if (savedTheme === "dark" || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add("dark");
      }
      document.getElementById("btnTheme").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem(STORAGE_THEME_KEY, document.body.classList.contains("dark") ? "dark" : "light");
      });

      // Manifest & Navigation logic
      async function loadManifest() {
        try {
          const res = await fetch("data/manifest.json?t=" + Date.now(), { cache: "no-cache" });
          if (res.ok) {
            manifest = await res.json();
          }
        } catch (e) {
          console.warn("無法取得 data/manifest.json，退回單期模式", e);
        }

        if (!manifest || !manifest.latest) {
          manifest = {
            latest: { id: "latest", path: "reports/latest.zh-TW.html", generated_at: "", count: 0 },
            archives: []
          };
        }

        // 扁平化期數列表：最新在前，隨後為歷史歸檔
        issuesList = [
          Object.assign({}, manifest.latest, { isLatest: true, displayTitle: "最新報告" }),
          ...(manifest.archives || []).map(a => Object.assign({}, a, { isLatest: false, displayTitle: a.generated_at || a.id }))
        ];

        renderArchiveDrawer();
        handleRoute();
      }

      function renderArchiveDrawer() {
        const container = document.getElementById("archiveListContainer");
        container.innerHTML = "";
        issuesList.forEach((issue, idx) => {
          const card = document.createElement("a");
          card.className = "archive-card" + (idx === currentIndex ? " current" : "");
          card.href = idx === 0 ? "#/latest" : "#/archive/" + encodeURIComponent(issue.filename || issue.id);
          
          const titleDiv = document.createElement("div");
          titleDiv.className = "date";
          titleDiv.textContent = issue.isLatest ? ("⚡ 最新報告 (" + (issue.generated_at ? issue.generated_at.replace("T", " ") : "即時") + ")") : (issue.generated_at ? issue.generated_at.replace("T", " ") : issue.id);
          
          const countDiv = document.createElement("div");
          countDiv.className = "count";
          countDiv.textContent = "新命中文章：" + (issue.count || 0) + " 篇";
          
          card.appendChild(titleDiv);
          card.appendChild(countDiv);
          card.addEventListener("click", (e) => {
            document.getElementById("archiveDrawer").classList.remove("open");
          });
          container.appendChild(card);
        });
      }

      function updateNavButtons() {
        const btnPrev = document.getElementById("btnPrev");
        const btnNext = document.getElementById("btnNext");
        const btnLatest = document.getElementById("btnLatest");
        const badge = document.getElementById("issueStatusBadge");
        const btnRawPage = document.getElementById("btnRawPage");

        if (issuesList.length <= 1) {
          btnPrev.disabled = true;
          btnNext.disabled = true;
          btnLatest.disabled = true;
        } else {
          // 下一篇 = 更靠近最新（index 變小）；上一篇 = 更舊歷史（index 變大）
          btnNext.disabled = (currentIndex <= 0);
          btnPrev.disabled = (currentIndex >= issuesList.length - 1);
          btnLatest.disabled = (currentIndex === 0);
        }

        const currentIssue = issuesList[currentIndex] || issuesList[0];
        if (currentIssue) {
          const total = issuesList.length;
          const currNum = currentIndex === 0 ? 1 : (currentIndex + 1);
          const timeStr = currentIssue.generated_at ? currentIssue.generated_at.replace("T", " ").substring(0, 16) : "";
          badge.textContent = (currentIssue.isLatest ? "⚡ 最新" : ("第 " + currNum + " / " + total + " 期")) + (timeStr ? " (" + timeStr + ")" : "");
          btnRawPage.href = currentIssue.path || "reports/latest.zh-TW.html";
        }
      }

      async function loadReportContent(issue) {
        const viewport = document.getElementById("readerViewport");
        viewport.innerHTML = '<div class="loading-spinner">正在載入報告內容...</div>';

        const targetPath = issue.path || "reports/latest.zh-TW.html";
        try {
          const res = await fetch(targetPath + "?t=" + Date.now(), { cache: "no-cache" });
          if (!res.ok) {
            throw new Error("HTTP " + res.status + " 找不到檔案：" + targetPath);
          }
          const htmlText = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, "text/html");

          // 取出主要內容與原有樣式
          const content = doc.getElementById("report-content") || doc.body;
          // 清除任何可疑 script
          content.querySelectorAll("script").forEach(s => s.remove());
          
          viewport.innerHTML = "";
          viewport.appendChild(content);

          // 重新初始化文章與篩選
          setupArticleInteractions();
          setupSourcePills();
          applyFilters();
        } catch (err) {
          let errDetail = err.message;
          if (location.protocol === "file:") {
            errDetail = "目前以 file:// 協定開啟，瀏覽器安全政策會阻擋動態 fetch 載入。請使用本地伺服器（例如 python3 -m http.server）或直接點選右上角『↗ 原始頁』瀏覽。";
          }
          viewport.innerHTML = '<div class="error-box"><h3>載入報告失敗</h3><p>' + errDetail + '</p><div style="margin-top:12px;"><a class="btn" href="' + targetPath + '">直接開啟報告原檔</a></div></div>';
        }
      }

      function setupArticleInteractions() {
        const readSet = getReadSet();
        const articles = document.querySelectorAll("#readerViewport .article-item, #readerViewport li");
        articles.forEach(item => {
          const link = item.querySelector("a");
          if (!link) return;
          const href = link.getAttribute("href");
          if (readSet.has(href)) {
            item.classList.add("is-read");
          }
          link.addEventListener("click", () => {
            markUrlRead(href);
            item.classList.add("is-read");
          });
        });
      }

      function setupSourcePills() {
        const pillContainer = document.getElementById("filterPills");
        pillContainer.innerHTML = "";
        const sections = document.querySelectorAll("#readerViewport .source-section, #readerViewport h2");
        if (!sections.length) return;

        const sourceCounts = { "ALL": 0 };
        document.querySelectorAll("#readerViewport .source-section").forEach(sec => {
          const name = sec.getAttribute("data-source") || (sec.querySelector("h2") ? sec.querySelector("h2").textContent.trim() : "其他");
          const count = sec.querySelectorAll(".article-item, li").length;
          sourceCounts[name] = count;
          sourceCounts["ALL"] += count;
        });

        Object.keys(sourceCounts).forEach(sourceName => {
          const pill = document.createElement("span");
          pill.className = "pill" + (sourceName === currentActiveSource ? " active" : "");
          pill.textContent = (sourceName === "ALL" ? "全部" : sourceName) + " (" + sourceCounts[sourceName] + ")";
          pill.addEventListener("click", () => {
            currentActiveSource = sourceName;
            document.querySelectorAll("#filterPills .pill").forEach(p => p.classList.remove("active"));
            pill.classList.add("active");
            applyFilters();
          });
          pillContainer.appendChild(pill);
        });
      }

      function applyFilters() {
        const query = (document.getElementById("searchInput").value || "").trim().toLowerCase();
        const onlyUnread = document.getElementById("toggleOnlyUnread").checked;
        const hideEmpty = document.getElementById("toggleHideEmpty").checked;

        document.querySelectorAll("#readerViewport .source-section").forEach(sec => {
          const sourceName = sec.getAttribute("data-source") || (sec.querySelector("h2") ? sec.querySelector("h2").textContent.trim() : "");
          const status = sec.getAttribute("data-status");
          
          let hasVisibleArticle = false;
          sec.querySelectorAll(".article-item, li").forEach(item => {
            const isRead = item.classList.contains("is-read");
            const text = item.textContent.toLowerCase();

            const matchQuery = !query || text.includes(query);
            const matchUnread = !onlyUnread || !isRead;
            const matchSource = (currentActiveSource === "ALL" || sourceName === currentActiveSource);

            if (matchQuery && matchUnread && matchSource) {
              item.classList.remove("search-hidden", "unread-hidden");
              hasVisibleArticle = true;
            } else {
              item.classList.add("search-hidden");
            }
          });

          if (hideEmpty && (status === "empty" || (!hasVisibleArticle && sec.querySelectorAll(".article-item, li").length > 0))) {
            sec.classList.add("empty-hidden");
          } else {
            sec.classList.remove("empty-hidden");
          }
        });
      }

      // Event listeners
      document.getElementById("searchInput").addEventListener("input", applyFilters);
      document.getElementById("toggleOnlyUnread").addEventListener("change", applyFilters);
      document.getElementById("toggleHideEmpty").addEventListener("change", applyFilters);

      document.getElementById("btnMarkAllRead").addEventListener("click", () => {
        document.querySelectorAll("#readerViewport .article-item, #readerViewport li").forEach(item => {
          const link = item.querySelector("a");
          if (link) markUrlRead(link.getAttribute("href"));
          item.classList.add("is-read");
        });
        applyFilters();
      });

      document.getElementById("btnPrev").addEventListener("click", () => {
        if (currentIndex < issuesList.length - 1) {
          navigateToIndex(currentIndex + 1);
        }
      });
      document.getElementById("btnNext").addEventListener("click", () => {
        if (currentIndex > 0) {
          navigateToIndex(currentIndex - 1);
        }
      });
      document.getElementById("btnLatest").addEventListener("click", () => {
        navigateToIndex(0);
      });
      document.getElementById("btnArchive").addEventListener("click", () => {
        document.getElementById("archiveDrawer").classList.toggle("open");
      });

      function navigateToIndex(newIdx) {
        if (newIdx < 0 || newIdx >= issuesList.length) return;
        currentIndex = newIdx;
        const target = issuesList[newIdx];
        if (target.isLatest) {
          location.hash = "#/latest";
        } else {
          location.hash = "#/archive/" + encodeURIComponent(target.filename || target.id);
        }
      }

      function handleRoute() {
        const hash = location.hash || "#/latest";
        if (hash === "#/latest" || hash === "#/" || hash === "") {
          currentIndex = 0;
        } else if (hash.startsWith("#/archive/")) {
          const fn = decodeURIComponent(hash.replace("#/archive/", ""));
          const foundIdx = issuesList.findIndex(x => (x.filename === fn || x.id === fn));
          currentIndex = foundIdx >= 0 ? foundIdx : 0;
        } else {
          currentIndex = 0;
        }

        updateNavButtons();
        if (issuesList[currentIndex]) {
          loadReportContent(issuesList[currentIndex]);
        }
      }

      window.addEventListener("hashchange", handleRoute);

      // Keyboard shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
          if (e.key === "Escape") e.target.blur();
          return;
        }
        if (e.key === "ArrowLeft" || e.key === "j" || e.key === "J") {
          document.getElementById("btnPrev").click();
        } else if (e.key === "ArrowRight" || e.key === "k" || e.key === "K") {
          document.getElementById("btnNext").click();
        } else if (e.key === "Home") {
          document.getElementById("btnLatest").click();
        } else if (e.key === "a" || e.key === "A") {
          document.getElementById("btnArchive").click();
        } else if (e.key === "u" || e.key === "U") {
          const toggle = document.getElementById("toggleOnlyUnread");
          toggle.checked = !toggle.checked;
          applyFilters();
        } else if (e.key === "/") {
          e.preventDefault();
          document.getElementById("searchInput").focus();
        } else if (e.key === "Escape") {
          document.getElementById("archiveDrawer").classList.remove("open");
        }
      });

      loadManifest();
    })();
  </script>
</body>
</html>
